name: Build & test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Qt runtime libs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 libpulse-mainloop-glib0
      - run: pip install -r requirements-dev.txt
      - name: Unit + offscreen UI tests
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m pytest -v

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Tests (offscreen)
        env: { QT_QPA_PLATFORM: offscreen }
        run: python -m pytest -v

      - name: Build exe (PyInstaller)
        run: pyinstaller packaging/ChazSongBook.spec --noconfirm

      - name: Smoke test built apps on the real Windows desktop platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($exe in @("dist\Chaz SongBook\ChazSongBook.exe", "dist\ChazSongBook-Portable.exe")) {
            $log = Join-Path $env:RUNNER_TEMP ("smoke-" + [IO.Path]::GetFileNameWithoutExtension($exe) + ".txt")
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test','--smoke-out',"`"$log`"" -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "$exe hung" }
            Get-Content $log
            if ($p.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern 'SMOKE OK' -Quiet)) { throw "$exe smoke test failed ($($p.ExitCode))" }
            Write-Host "$exe -> OK" -ForegroundColor Green
          }

      - name: Render screenshots with the Windows build
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Chaz SongBook\ChazSongBook.exe" -ArgumentList '--screenshots','windows-screenshots' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'screenshots hung' }
          Get-ChildItem windows-screenshots

      - name: Package zip + SHA256
        run: python tools/package_win.py dist out

      - name: Test the installer script (Windows PowerShell 5.1, no admin)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $t = Join-Path $env:RUNNER_TEMP 'od'
          New-Item -ItemType Directory $t | Out-Null
          Copy-Item out\*.zip, out\*.zip.sha256, Install-ChazSongBook.ps1 $t
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$t\Install-ChazSongBook.ps1" -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw "installer exit $LASTEXITCODE" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Chaz SongBook\ChazSongBook.exe'
          if (-not (Test-Path $exe)) { throw 'not installed' }
          foreach ($l in @((Join-Path ([Environment]::GetFolderPath('Programs')) 'Chaz SongBook.lnk'), (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Chaz SongBook.lnk'))) {
            if (-not (Test-Path $l)) { throw "missing shortcut $l" } else { Write-Host "shortcut ok: $l" }
          }
          $log = Join-Path $env:RUNNER_TEMP 'smoke-installed.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test','--smoke-out',"`"$log`"" -PassThru -Wait
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw 'installed app smoke test failed' }
          # tamper check: a corrupted sidecar hash must abort the install
          Set-Content "$t\$((Get-ChildItem $t -Filter *.zip).Name).sha256" ('0' * 64)
          $ErrorActionPreference = 'Continue'
          & powershell -NoProfile -ExecutionPolicy Bypass -File "$t\Install-ChazSongBook.ps1" -NoLaunch 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -eq 0) { throw 'installer accepted a bad checksum' } else { Write-Host 'bad checksum correctly rejected' }
          exit 0

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ChazSongBook-win64
          path: |
            out/*.zip
            out/*.zip.sha256
          if-no-files-found: error

      - name: Upload Windows screenshots
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: windows-screenshots/
          if-no-files-found: error

      - name: GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.zip.sha256
            Install-ChazSongBook.ps1
